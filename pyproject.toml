[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tpddl-qa-framework"
version = "1.0.0"
description = "Python web, API, database and performance QA framework"
requires-python = ">=3.11"
dependencies = ["pytest>=8,<10", "requests>=2.32,<3", "selenium>=4.25,<5", "jsonschema>=4.23,<5", "pytest-html>=4,<5", "pytest-xdist>=3,<4", "pytest-rerunfailures>=14,<17", "SQLAlchemy>=2,<3", "openpyxl>=3.1,<4", "Faker>=30,<41"]

[project.optional-dependencies]
database = ["psycopg[binary]>=3.2,<4", "PyMySQL>=1.1,<2", "pymongo>=4.9,<5", "redis>=5,<8", "firebase-admin>=6,<8", "paramiko>=3.5,<5"]
performance = ["locust>=2.32,<3"]
bdd = ["pytest-bdd>=8,<9"]
mobile = ["Appium-Python-Client>=4,<6"]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-ra --strict-markers --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml"
markers = ["smoke: essential checks", "sanity: focused checks", "web: browser tests", "api: HTTP tests", "database: database tests", "integration: requires configured external service", "mobile: Appium tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
